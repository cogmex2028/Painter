[build]
  command = "npm run build"
  publish = "dist"

# Astro's directory format already serves /path/index.html for /path/
# so no additional redirects are needed.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
