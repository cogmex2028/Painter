[build]
  command = "npm run build"
  publish = "dist"

# Doorway-page cleanup — these URLs were de-indexed by Google as low-quality
# duplicates of the canonical pages they target. 301 the signals so any
# remaining link equity / index history flows to the right destination.
[[redirects]]
  from = "/painter-in-dubai/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/painting-company-in-dubai/*"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/best-painters-in-dubai/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/painting-cost-1bhk-dubai/*"
  to = "/pricing/"
  status = 301
  force = true

[[redirects]]
  from = "/painting-cost-2bhk-dubai/*"
  to = "/pricing/"
  status = 301
  force = true

[[redirects]]
  from = "/painting-cost-3bhk-dubai/*"
  to = "/pricing/"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
